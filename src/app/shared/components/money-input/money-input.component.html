<div class="money-input" [class.is-invalid]="shouldShowErrors()">
    <input pInputText [appNoAutofill]="displayValue" class="flex-1" [placeholder]="placeholder" [disabled]="isDisabled" [value]="displayValue" [attr.inputmode]="currency === 'USD' ? 'decimal' : 'numeric'" [attr.pattern]="currency === 'USD' ? null : '[0-9]*'" (focus)="onFocus()" (blur)="onBlur()" (input)="onInput($any($event.target).value)" />

    <p-select class="w-28" [options]="currencyOptions" [ngModel]="currency" (ngModelChange)="onCurrencyChange($event)" [disabled]="isDisabled"> </p-select>
</div>

<app-control-error [control]="control" [messages]="errorMessages" />
