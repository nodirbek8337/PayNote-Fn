<div class="app-input-container">
  <input
    type="tel"
    pInputText
    style="width: 100%; height: 40px;"
    [placeholder]="placeholder"
    [disabled]="isDisabled"
    [value]="displayValue"
    (input)="onInput($event)"
    maxlength="16"
    [ngClass]="{ 'is-invalid': shouldShowErrors() }"
  />

  <app-control-error [control]="control" [messages]="errorMessages" />
</div>
