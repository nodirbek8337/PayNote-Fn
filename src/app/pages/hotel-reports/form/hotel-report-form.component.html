<form [formGroup]="form" (ngSubmit)="submitForm()" class="hotel-report-form p-fluid">
    <div class="hotel-report-form__grid">
        <div class="form-field hotel-report-form__full">
            <label>Hisobot nomi</label>
            <app-input formControlName="name" placeholder="Masalan: Kunlik hisobot"></app-input>
        </div>

        <div class="form-field">
            <label>Hisobot turi</label>
            <app-select formControlName="type" [options]="typeOptions" optionLabel="label" optionValue="value" [showClear]="false" [filter]="false"></app-select>
        </div>

        <div class="form-field">
            <label>Yuborish vaqti</label>
            <app-time-input formControlName="sendTime" ariaLabel="Yuborish vaqtini tanlash"></app-time-input>
        </div>

        @if (type === 'WEEKLY') {
            <div class="form-field hotel-report-form__full">
                <label>Yuboriladigan hafta kuni</label>
                <app-select formControlName="weekDay" [options]="weekDays" optionLabel="label" optionValue="value" [showClear]="false" [filter]="false"></app-select>
            </div>
        }

        @if (type === 'MONTHLY') {
            <div class="form-field hotel-report-form__full hotel-report-form__month-end">
                <span>Yuboriladigan kun</span>
                <strong>Har oyning oxirgi kuni</strong>
            </div>
        }

        <app-switch-toggle
            class="hotel-report-form__full"
            formControlName="isActive"
            label="Hisobot holati"
            [trueLabel]="'Faol'"
            [falseLabel]="'Faol emas'"
            [activeDescription]="'Hisobot belgilangan vaqtda Telegramga yuboriladi'"
            [inactiveDescription]="'Hisobot vaqtincha yuborilmaydi'"
            [showStateText]="true"
        ></app-switch-toggle>
    </div>

    <div class="flex justify-end gap-2 mt-3">
        <button pButton type="button" class="p-button-outlined" [disabled]="loading" (click)="closeModal()"><span>Bekor qilish</span></button>
        <button pButton type="submit" class="form-save-btn" [disabled]="loading">
            @if (loading) { <i class="pi pi-spinner pi-spin" aria-hidden="true"></i> } @else { <i class="pi pi-check" aria-hidden="true"></i> }
            <span>Saqlash</span>
        </button>
    </div>
</form>
