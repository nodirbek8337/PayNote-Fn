<form [formGroup]="form" (ngSubmit)="submitForm()" autocomplete="off" class="p-fluid entity-form">
    <div class="inventory-details">
        <div class="detail-item">
            <span class="detail-label">Maxsulot nomi</span>
            <strong>{{ productName }}</strong>
        </div>
        <div class="detail-item">
            <span class="detail-label">Maxsulot narxi</span>
            <strong>{{ productPrice | money: productCurrency }}</strong>
        </div>
    </div>

    <div class="form-field">
        <label>Maxsulot soni</label>
        <app-input [placeholder]="amountPlaceholder" type="number" formControlName="amount" [allowMathExpression]="true"></app-input>
    </div>

    <div class="flex justify-end gap-2 mt-4">
        <button pButton type="button" (click)="closeModal()" class="p-button-outlined"><span>Ortga</span></button>
        <button pButton type="submit" [disabled]="loading || form.invalid" class="form-save-btn">
            @if (loading) { <i class="pi pi-spinner pi-spin" aria-hidden="true"></i> }
            <span>Saqlash</span>
        </button>
    </div>
</form>
