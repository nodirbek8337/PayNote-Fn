<form [formGroup]="form" (ngSubmit)="submitForm()" autocomplete="off" class="p-fluid users-form">
    <div class="form-field">
        <label>Login</label>
        <app-input formControlName="username" placeholder="Login kiriting"> </app-input>
    </div>

    <div class="form-field">
        <label>Rol tanlash</label>
        <app-select style="width: 100%" formControlName="role" [options]="roleOptions" optionLabel="label" optionValue="value" placeholder="Rol tanlang" [showClear]="false" [filter]="false"> </app-select>
    </div>

    <div class="form-field">
        <label>Parol</label>
        <app-input formControlName="password" [type]="'password'" [placeholder]="passwordLabel"></app-input>
    </div>
    <div class="form-field">
        <label>Telegram username <small>(ixtiyoriy)</small></label>
        <app-input formControlName="telegramUsername" inputName="telegram-username" autocomplete="off" placeholder="@username yoki t.me/username"></app-input>
        <small>Saqlangach, aynan shu Telegram akkauntidan botga /start yuboring.</small>
    </div>

    <app-switch-toggle
        formControlName="isActive"
        label="Holati"
        [trueLabel]="'Faol'"
        [falseLabel]="'Faol emas'"
        [activeDescription]="'Foydalanuvchi tizimga kira oladi'"
        [inactiveDescription]="'Foydalanuvchi tizimga kira olmaydi'"
        [showStateText]="true">
    </app-switch-toggle>

    <div class="flex justify-end gap-2 mt-4">
        <button pButton type="button" label="Ortga" (click)="closeModal()" class="p-button-outlined"></button>
        <button pButton type="submit" label="Saqlash" [loading]="loading" [disabled]="loading || form.invalid" class="form-save-btn"></button>
    </div>
</form>
