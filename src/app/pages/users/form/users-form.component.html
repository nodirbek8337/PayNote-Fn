<form [formGroup]="form" (ngSubmit)="submitForm()" autocomplete="off" class="p-fluid users-form">
    <div class="form-row">
        <div class="form-field">
            <label>Login</label>
            <app-input formControlName="username" placeholder="Login kiriting"></app-input>
        </div>
        <div class="form-field">
            <label>Rol tanlash</label>
            <app-select style="width: 100%" formControlName="role" [options]="roleOptions" optionLabel="label" optionValue="value" placeholder="Rol tanlang" [showClear]="false" [filter]="false"></app-select>
        </div>
    </div>

    @if (isEdit) {
        <div class="form-field password-action">
            <button pButton type="button" class="p-button-outlined" [disabled]="loading" (click)="togglePasswordChange()">{{ changePassword ? 'Parolni almashtirishni bekor qilish' : 'Parolni almashtirish' }}</button>
            @if (!changePassword) {
                <small class="field-help">Parol o'zgarmaydi. Almashtirish uchun tugmani bosing.</small>
            }
        </div>
    }
    @if (!isEdit || changePassword) {
        <div class="form-field">
            <label>{{ isEdit ? 'Yangi parol' : 'Parol' }}</label>
            <app-input formControlName="password" [type]="'password'" [placeholder]="passwordLabel"></app-input>
        </div>
    }

    <div class="form-row">
        <div class="form-field form-field--telegram">
            <label>Telegram telefon <small>(ixtiyoriy)</small></label>
            <app-phone-input formControlName="telegramPhone" [allowEmpty]="true"></app-phone-input>
        </div>
        <div class="form-field form-field--telegram">
            <label>Telegram username <small>(ixtiyoriy)</small></label>
            <app-input formControlName="telegramUsername" autocomplete="off" placeholder="@username yoki t.me/username"></app-input>
        </div>
    </div>

    <div class="notification-switches">
        @if (!isCleanerRole) {
        <app-switch-toggle formControlName="hotelBookings" label="Mehmonxona buyurtmalari"
            trueLabel="Ruxsat" falseLabel="Ruxsat berilmagan"
            activeDescription="Har bir yangi buyurtma Telegramga keladi"
            inactiveDescription="Yangi buyurtma xabarlari kelmaydi"></app-switch-toggle>
        <app-switch-toggle formControlName="expenseNotifications" label="Mehmonxona chiqimlari"
            trueLabel="Ruxsat" falseLabel="Ruxsat berilmagan"
            activeDescription="Yangi chiqim cheklari va summasi Telegramga keladi"
            inactiveDescription="Chiqim xabarlari kelmaydi"></app-switch-toggle>
        <app-switch-toggle formControlName="hotelReports" label="Davriy hisobotlar"
            trueLabel="Ruxsat" falseLabel="Ruxsat berilmagan"
            activeDescription="Kunlik, haftalik va oylik hisobotlar keladi"
            inactiveDescription="Kunlik, haftalik va oylik hisobotlar kelmaydi"></app-switch-toggle>
        <app-switch-toggle formControlName="fridgeSales" label="Muzlatgich sotuvlari"
            trueLabel="Ruxsat" falseLabel="Ruxsat berilmagan"
            activeDescription="Har bir yangi sotuv Telegramga keladi"
            inactiveDescription="Yangi sotuv xabarlari kelmaydi"></app-switch-toggle>
        }
        <app-switch-toggle formControlName="cleaningTasks" label="Tozalash topshiriqlari"
            trueLabel="Ruxsat" falseLabel="Ruxsat berilmagan"
            activeDescription="Yangi tozalash topshiriqlari Telegramga keladi"
            inactiveDescription="Tozalash topshiriqlari Telegramga kelmaydi"></app-switch-toggle>

    <app-switch-toggle
        formControlName="isActive"
        label="Foydalanuvchi holati"
        [trueLabel]="'Faol'"
        [falseLabel]="'Faol emas'"
        [activeDescription]="'Foydalanuvchi tizimga kira oladi'"
        [inactiveDescription]="'Foydalanuvchi tizimga kira olmaydi'"
        [showStateText]="true"
    >
    </app-switch-toggle>
    </div>

    <div class="flex justify-end gap-2 mt-3">
        <button pButton type="button" (click)="closeModal()" class="p-button-outlined"><span>Ortga</span></button>
        <button pButton type="submit" [disabled]="loading || form.invalid" class="form-save-btn">
            @if (loading) { <i class="pi pi-spinner pi-spin" aria-hidden="true"></i> }
            <span>Saqlash</span>
        </button>
    </div>
</form>
