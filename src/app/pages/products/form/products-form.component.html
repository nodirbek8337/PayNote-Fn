<form [formGroup]="form" (ngSubmit)="submitForm()" autocomplete="off" class="p-fluid entity-form">
    <app-input placeholder="Maxsulot nomini kiriting" formControlName="name"></app-input>
    <app-money-input formControlName="price" placeholder="Maxsulot narxini kiriting" [defaultCurrency]="'UZS'" [emitCurrency]="false" [required]="true" [allowNegative]="false"></app-money-input>
    <label class="currency-field">Valuta
        <app-select formControlName="currency" [options]="currencyOptions" [showClear]="false"></app-select>
    </label>

    <div class="flex justify-end gap-2 mt-4">
        <button pButton type="button" (click)="closeModal()" class="p-button-outlined"><span>Ortga</span></button>
        <button pButton type="submit" [disabled]="loading || form.invalid" class="form-save-btn">
            @if (loading) { <i class="pi pi-spinner pi-spin" aria-hidden="true"></i> }
            <span>Saqlash</span>
        </button>
    </div>
</form>
