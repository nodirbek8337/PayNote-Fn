<!doctype html>
<html lang="uz">
    <head>
        <meta charset="utf-8" />
        <title>Pay Note</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://primefaces.org" />
        <link rel="icon" type="image/png" href="assets/images/favicon.png" />
        <style>
            html,
            body {
                min-height: 100%;
                margin: 0;
                background: #07111f;
            }

            body:not(.app-ready) > app-root {
                visibility: hidden;
            }

            .app-boot-loader {
                position: fixed;
                inset: 0;
                z-index: 999999;
                display: grid;
                place-items: center;
                background: #07111f;
                transition: opacity 0.18s ease;
            }

            .app-boot-spinner {
                width: 38px;
                height: 38px;
                box-sizing: border-box;
                border: 3px solid rgba(117, 166, 255, 0.2);
                border-top-color: #75a6ff;
                border-radius: 50%;
                animation: app-boot-spin 0.75s linear infinite;
            }

            body.app-ready > .app-boot-loader {
                opacity: 0;
                pointer-events: none;
            }

            @keyframes app-boot-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body>
        <div class="app-boot-loader" aria-label="Sahifa yuklanmoqda" role="status">
            <span class="app-boot-spinner"></span>
        </div>
        <app-root></app-root>
    </body>
</html>
